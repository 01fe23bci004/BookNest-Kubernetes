apiVersion: v1
kind: Secret
metadata:
  name: booknest-admin-secret
  namespace: booknest
type: Opaque
stringData:
  ADMIN_USERNAME: "REPLACE_WITH_ADMIN_USERNAME"
  ADMIN_PASSWORD: "REPLACE_WITH_STRONG_PASSWORD"
  SESSION_SECRET_KEY: "REPLACE_WITH_RANDOM_SESSION_SECRET"
  credentials.json: |
    {
      "ADMIN_USERNAME": "REPLACE_WITH_ADMIN_USERNAME",
      "ADMIN_PASSWORD": "REPLACE_WITH_STRONG_PASSWORD",
      "SESSION_SECRET_KEY": "REPLACE_WITH_RANDOM_SESSION_SECRET"
    }
