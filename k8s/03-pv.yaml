apiVersion: v1
kind: PersistentVolume
metadata:
  name: booknest-data-pv
  labels:
    app.kubernetes.io/name: booknest
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /mnt/data/booknest
    type: DirectoryOrCreate
